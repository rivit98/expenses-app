name: "Deploy ef to dokku"

on:
  push:
    branches:
      - master
    paths-ignore:
      - "backend/**"

defaults:
  run:
    working-directory: ./frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ./frontend/package-json.lock
      - name: Install dev deps
        run: |
          npm install -D
      - name: Run linters
        run: |
          npm run lint
          npm run prettier:check

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Cloning repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_push_flags: "--force"
          git_remote_url: ${{ secrets.DOKKU_URL_FRONTEND }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
